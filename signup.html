<!-- ============================================
    SIGNUP PAGE
============================================= -->
<body class = "get-started-page">
    <div class = "get-started-card signup-card">

        <div class = "get-started-header">
            <img src = "graphics/lina_logo.png" class = "get-started-logo" alt = "LINA Logo">
            <h1>Welcome To LINA !</h1>
            <p>Create your account to get started</p>
        </div>

        <form id = "get-started-form">
            <fieldset>
                <legend>Personal Information</legend>

                <div class = "input-info">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" placeholder="Enter your first name" required>
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Enter your last name" required>
                    <label for = "email">Email</label>
                    <input type = "email" id = "email" name = "email" placeholder = "Enter your email" required>     
                    <label for = "username">Username</label>
                    <input type = "text" id = "username" name = "username" placeholder = "Enter your username" required>     
                    <small class="guide">3–20 characters (letters, numbers, and underscores only).</small>
                </div>                

                <div class = "input-info">
                    <label for = "password">Password</label>
                    <div class="password-wrapper">
                        <input type = "password" id = "enter-password" name = "enter-password" placeholder = "Enter your password" required>
                        <button type="button" id="toggle-pass" class="toggle-btn" aria-label="Show password">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>
                    <small class="guide">At least 8 characters, including a number, uppercase and lowercase letter. </small>

                    <label for = "confirm-password">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type = "password" id = "confirm-password" name = "confirm-password" placeholder="Confirm your password" required>
                        <button type="button" id="toggle-confirm-pass" class="toggle-btn" aria-label="Show password">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>
                </div>
     
                <div class = "get-started-options">
                    <label>
                        <input type = "checkbox"> Remember me
                    </label>
                    <p>Forgot Password?</p>
                    <label>
                        <input type = "checkbox" required> I have read and agree to the <span class="terms">Terms of Service</span> and <span class="terms">Privacy Policy</span>.
                    </label>
                </div>

                <button type="submit" class="signup-btn">Create Account</button>
            
                <div class = "line"><span>or continue with</span></div>
                <div class = "social">
                    <button type = "button" class="social-btn google" id="google">
                        <i class="fa-brands fa-google"></i>
                        <span>Google</span></button>
                    <button type="button" id="canvas" class="social-btn canvas">
                        <i class="fa-solid fa-school"></i>
                        <span>Canvas</span></button>
                </div>

                <div id ="canvas-option" class="canvas-hidden">
                    <label for="select-univ">Find Your University</label>
                    <div class="select-container">
                        <img src="graphics/hau_logo.png" alt="HAU logo" id="hau-logo" class="hau-logo">
                        <select id="select-univ" name="univ" class="univ-dropdown">
                            <option value="" disabled selected>Select a school...</option>
                            <option value="hau">Holy Angel University</option>
                        </select>
                    </div>
                    <button type="button" id="canvas-btn" class="signup-btn">Continue with Canvas</button>
                </div>
            </fieldset>
        </form>
    </div>

    <!-- main.js for signup -->
     <script type = "module" src = "main.js"></script>
</body>

</html>

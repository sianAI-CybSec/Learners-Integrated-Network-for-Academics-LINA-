<!-- ============================================
    LOGIN PAGE
============================================= -->
<body class = "get-started-page">
    <div class = "get-started-card">

        <div class = "get-started-header">
            <img src = "graphics/lina_logo.png" class = "get-started-logo" alt = "LINA Logo">
            <h1>Welcome Back !</h1>
            <p>Please log in to LINA to continue towards better learning</p>
        </div>

        <form id = "login-form">
            <div class = "input-info">
                <label for = "email">Email or Username</label>
                <input type = "text" id = "email" name = "email" placeholder = "Enter your email or username" required>            
            </div>
            <div class = "input-info">
                <label for = "password">Password</label>
                <div class="password-wrapper">
                    <input type = "password" id = "password" name = "password" placeholder = "Enter your password" required>
                    <button type="button" id="toggle-pass" class="toggle-btn" aria-label="Show password">
                        <i class="fa-regular fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <div class = "get-started-options">
                <label>
                    <input type = "checkbox"> Remember me
                </label>
            </div>

            <button type="submit" class="login-btn">Log In</button>
            
            <div class = "line"><span>or continue with</span></div>
            <div class = "social">
                <button type = "button" class="social-btn google" id="google">
                    <i class="fa-brands fa-google"></i>
                    <span>Google</span></button>
                <button type="button" id="canvas" class="social-btn canvas">
                    <i class="fa-solid fa-school"></i>
                    <span>Canvas</span></button>
            </div>

            <div id ="canvas-option" class="canvas-hidden">
                <label for="select-univ">Find Your University</label>
                <div class="select-container">
                    <img src="graphics/hau_logo.png" alt="HAU logo" id="hau-logo" class="hau-logo">
                    <select id="select-univ" name="univ" class="univ-dropdown">
                        <option value="" disabled selected>Select a school...</option>
                        <option value="hau">Holy Angel University</option>
                    </select>
                </div>
                <button type="button" id="canvas-btn" class="login-btn">Continue with Canvas</button>
            </div>

            <p class="signup">Don't have an account? <a href="signup.html">Sign Up!</a></p>
        </form>
    </div>

    <!-- main.js for login -->
     <script type = "module" src = "main.js"></script>
     <script src="transition.js"></script>
</body>

</html>
